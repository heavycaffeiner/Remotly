name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Signed release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The sshcore AAR is a build output, not a checked-in binary, so the
      # release builds it from source like every other artifact here.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: mobile/go.sum

      - name: Build sshcore AAR
        run: scripts/build-sshcore.sh

      - uses: gradle/actions/setup-gradle@v4

      # The keystore is a repository secret, base64 encoded so it survives the
      # environment intact. It is written outside the working tree, so it is
      # never picked up by a build step or an upload glob, and it goes away
      # with the runner.
      #
      # The value is passed through env rather than interpolated into the
      # script: an expression expanded into the command line would appear in
      # the run log before masking applies.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.REMOTLY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "REMOTLY_KEYSTORE_BASE64 is not set; a release cannot be signed" >&2
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build
        working-directory: app/android
        env:
          REMOTLY_KEYSTORE: ${{ runner.temp }}/release.jks
          REMOTLY_KEYSTORE_PASSWORD: ${{ secrets.REMOTLY_KEYSTORE_PASSWORD }}
          REMOTLY_KEY_ALIAS: ${{ secrets.REMOTLY_KEY_ALIAS }}
          REMOTLY_KEY_PASSWORD: ${{ secrets.REMOTLY_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # An unsigned APK means the credentials did not reach Gradle. Failing
      # here is the point: an unsigned build must never be published.
      #
      # The certificate is verified, not printed: --print-certs writes the
      # signing identity into a public build log.
      - name: Verify signature
        run: |
          apk=app/android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "release APK is unsigned; signing credentials did not apply" >&2
            ls -la app/android/app/build/outputs/apk/release/ >&2
            exit 1
          fi
          # The runner ships several build-tools versions; a glob would pass the
          # extra paths to apksigner as arguments. Take the newest one.
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify "$apk"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: remotly-release-apk
          path: app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/android/app/build/outputs/apk/release/app-release.apk
