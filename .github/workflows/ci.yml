name: CI

on:
  push:
    branches: [master]
  pull_request:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (typecheck, lint, format, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Check
        working-directory: app
        run: pnpm check

  android:
    name: Android (unit tests, debug APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        working-directory: app/android
        run: ./gradlew testDebugUnitTest

      - name: Debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug

  go:
    name: Go (daemon, relay, mobile)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [daemon, relay, mobile]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      # The race detector is the point of running these in CI: the transport and
      # session layers are concurrent, and a data race there corrupts a user's
      # terminal rather than failing loudly.
      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -race ./...
