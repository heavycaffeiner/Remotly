name: CI

on:
  push:
    branches: [master]
  pull_request:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (typecheck, lint, format, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Check
        working-directory: app
        run: pnpm check

  android:
    name: Android (unit tests, debug APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The sshcore AAR is a build output rather than a checked-in binary, so
      # every Android build starts by producing it. Go and the NDK are only
      # needed for that step.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: mobile/go.sum

      - name: Build sshcore AAR
        run: scripts/build-sshcore.sh

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        working-directory: app/android
        run: ./gradlew testDebugUnitTest

      - name: Debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug

  go:
    name: Go (daemon, relay, mobile)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [daemon, relay, mobile]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      # The race detector is the point of running these in CI: the transport and
      # session layers are concurrent, and a data race there corrupts a user's
      # terminal rather than failing loudly.
      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -race ./...

  # The daemon and relay ship for darwin and windows, but every other job here
  # builds for linux only. A platform-specific import breaks just that target,
  # so without this the failure surfaces at release time.
  cross:
    name: Cross compile (darwin, windows)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: daemon/go.sum

      - name: Build daemon
        working-directory: daemon
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

      # The relay has no windows/arm64 target in the release set, so it is not
      # built for one here either.
      - name: Build relay
        if: ${{ !(matrix.goos == 'windows' && matrix.goarch == 'arm64') }}
        working-directory: relay
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

      - name: Vet
        working-directory: daemon
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go vet ./...
