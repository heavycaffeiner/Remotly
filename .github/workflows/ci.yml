name: CI

on:
  push:
    branches: [master]
  pull_request:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (unit tests, debug APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The sshcore AAR is a build output rather than a checked-in binary, so
      # every Android build starts by producing it. Go and the NDK are only
      # needed for that step.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: mobile/go.sum

      - name: Build sshcore AAR
        run: scripts/build-sshcore.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        working-directory: app/android
        run: ./gradlew testDebugUnitTest

      - name: Debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug

  go:
    name: Go (mobile)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [mobile]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      # The race detector is the point of running these in CI: the transport
      # and session layers are concurrent, and a data race there corrupts a
      # user's terminal rather than failing loudly.
      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -race ./...
