plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.kotlin.android) apply false
    alias(libs.plugins.kotlin.compose) apply false
}

ext {
    buildToolsVersion = "37.0.0"
    minSdkVersion = 24
    compileSdkVersion = 37
    targetSdkVersion = 36
    ndkVersion = "28.2.13676358"

    // The single version source is gradle.properties. CI may override either
    // field with -PremotlyVersionName or -PremotlyVersionCode.
    remotlyVersionName = project.property("remotlyVersion")

    // major.minor.patch to a monotonic integer: 1.2.3 becomes 10203. The
    // minor and patch fields are bounded at 99 so the mapping stays ordered;
    // exceeding that would produce a lower code than the previous release.
    def parts = (remotlyVersionName =~ /^(\d+)\.(\d+)\.(\d+)$/)
    if (!parts.find()) {
        throw new GradleException(
                "remotlyVersion '" + remotlyVersionName + "' is not major.minor.patch")
    }
    def vMajor = parts.group(1).toInteger()
    def vMinor = parts.group(2).toInteger()
    def vPatch = parts.group(3).toInteger()
    if (vMinor > 99 || vPatch > 99) {
        throw new GradleException(
                "version " + remotlyVersionName +
                " exceeds the two-digit minor and patch bound")
    }
    remotlyVersionCode = vMajor * 10000 + vMinor * 100 + vPatch
}
