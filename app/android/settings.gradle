pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

// Provisions the JDK the build asks for. Without it a machine whose default
// java is a JRE fails at compileDebugJavaWithJavac rather than at
// configuration, which reads as a Kotlin plugin fault.
plugins { id("org.gradle.toolchains.foojay-resolver-convention").version("1.0.0") }

dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
        // The Go sshcore engine, built by scripts/build-sshcore.sh into
        // app/libs. Declared here rather than in the app project, because a
        // project-level repositories block replaces these instead of adding
        // to them.
        flatDir { dirs "${rootDir}/app/libs" }
    }
}

rootProject.name = 'Remotly'
include ':app'
